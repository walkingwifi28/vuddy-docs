name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build HTML
        run: |
          mkdir -p _site
          {
            cat assets/css/reset.css
            printf '\n'
            sed '/^@import "reset.css";$/d' assets/css/style.css
          } > /tmp/md2vhtml-style.css
          npx --yes md2vhtml@latest -i index.md -c /tmp/md2vhtml-style.css -s assets/js/main.js -o _site/index.html
          cp assets/favicon.png _site/favicon.png
          mkdir -p _site/assets
          cp -R assets/images _site/assets/images
          node <<'NODE'
          const fs = require('fs');
          const htmlPath = '_site/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');

          if (!/<title>/i.test(html)) {
            html = html.replace('</head>', '    <title>Vuddyサービス資料</title>\n  </head>');
          }

          if (!/rel=["']icon["']/i.test(html)) {
            html = html.replace('</head>', '    <link rel="icon" type="image/png" href="favicon.png">\n  </head>');
          }

          fs.writeFileSync(htmlPath, html);
          NODE
          if [ -d img ]; then
            cp -R img _site/img
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
